<!DOCTYPE html>
<html lang="en">
    <head>
        {% load static %}
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AfriMart - Cameroon's Online Market</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
            theme: {
                extend: {
                colors: {
                    primary: '#10B981',  // Emerald green
                    secondary: '#3B82F6', // Blue
                    accent: '#000',   // Amber
                    dark: '#1F2937',     // Dark gray
                    light: '#F9FAFB'     // Light gray
                }
                }
            }
            }
        </script>
        <style>
            .auth-bg {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('assets/market-bg-2.jpg');
            background-size: cover;
            background-position: center;
            }
            .input-field:focus {
            box-shadow: 0 0 0 2px #10B981;
            }
        </style>
        <link href="{% static 'src/output.css' %}" rel="stylesheet">
        <link rel="stylesheet" href="{% static 'src/verification_code_stylesheet.css' %}">
        <link rel="icon" type="image/png" href="{% static 'src/favicon.png' %}">
    </head>
    <body>
        

      <form method="post" enctype="multipart/form-data" action="" id="form2" class="formz">
        {% csrf_token %}
        <label class="block text-sm font-medium text-gray-700 mb-1"">Code</label>
        <input name="code" placeholder="ENTER CODE SENT BY EMAIL" class="w-full px-4 py-3 rounded-lg border border-gray-300 input-field focus:outline-none focus:border-primary">
        <br>
        <button type="submit" class="w-full bg-primary hover:bg-primary-dark text-white py-3 px-4 rounded-lg font-medium transition-colors">Verify</button>
      </form>
    </body>
</html>
